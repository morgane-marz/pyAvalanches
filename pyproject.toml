[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyAvalanches"
version = "0.1.2"
description = "A Python library for detecting, analyzing, and characterizing neuronal avalanches."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["neuronal avalanches", "neuroscience", "criticality", "eeg", "meg", "power-law", "signal processing"]
authors = [
    { name = "Morgane Marzulli"},
    { name = "Marianna Angiolelli"},
    { name = "Camilla Mannino"},
    { name = "Matteo Demuru"},
    { name = "Pierpaolo Sorrentino"},
    { name = "Marie-Constance Corsi"},
]
#maintainers = [
#  { name = "Morgane Marzulli", email = "morgane.marzulli@icm-institute.org" },
#]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "bctpy>=0.6.1",
    "matplotlib>=3.11.1",
    "mne>=1.12.1",
    "networkx>=3.2.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
]

[project.urls]
Homepage = "https://github.com/morgane-marz/pyAvalanches"
Documentation = "https://pyavalanches.readthedocs.io/"
Repository = "https://github.com/morgane-marz/pyAvalanches"


[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "pytest-cov>=2.12.0",
]
lint = [
    "black>=21.0",
    "flake8>=3.9.0",
    "isort>=5.10.0",
    "mypy>=0.900",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "numpydoc>=1.0",
]
dev = [
    "pyAvalanches[test,lint,docs]",
]

# --- Hatchling Configuration ---
[tool.hatch.version]
path = "pyavalanches/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pyAvalanches"]

[tool.hatch.build.targets.sdist]
include = [
    "/pyAvalanches",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pytest.ini",
]

# --- Tool Configurations ---

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
#addopts = "-v --cov=src/pyavalanches --cov-report=html --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false